name: windows

# Velocity on real Windows (docs/windows.md has the matrix these jobs prove):
#
#   x64          Windows Server 2022 and 2025, PHP 8.1, 8.3, 8.5 (setup-php):
#                Windows unit gate, smoke test, HTTPS (self-signed and the
#                Windows certificate store).
#   x86          Windows Server 2022, the official 32-bit PHP 8.3: the same.
#   arm64        Windows 11 on ARM (windows-11-arm): the same, plus the full
#                Exponential site under load and the Windows service. Native
#                ARM64 PHP when windows.php.net lists one, else x64 PHP under
#                Windows' x64 emulation.
#   exponential  Windows Server 2022 (PHP 8.3) and 2025 (PHP 8.5): a complete
#                Exponential site on SQLite, its pages, the admin login and a
#                short load; then Velocity as a Windows service through
#                packaging/windows/vcc.ps1 under a virtual account, with HTTPS
#                from the certificate store, recovery, and the same site.
#   unit-survey  every unit test on Windows, for the record (not a gate).
#   binaries     Windows Server 2022 and 2025: the committed sbin\qbixserver.phar
#                (PHP 8.5) and the latest release's static
#                qbixserver-windows-x64.exe, through the same smoke test.
#
# Logs are uploaded as artifacts either way.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  x64:
    name: ${{ matrix.os }} PHP ${{ matrix.php }} x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        php: ['8.1', '8.3', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: sockets, mbstring, openssl, curl, fileinfo, sqlite3, pdo_sqlite
          ini-values: memory_limit=512M
          coverage: none

      - name: PHP and Windows
        shell: powershell
        run: |
          php -v
          (Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber, OSArchitecture | Format-List | Out-String).Trim()

      - name: Windows unit gate
        shell: powershell
        run: |
          $env:QBIX_TEST_TMP = $env:RUNNER_TEMP
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\windows\unit-survey.ps1 -Php (Get-Command php).Source -Gate -LogDir "$pwd\smoke-logs"
          exit $LASTEXITCODE

      - name: Smoke test (real server, portable workers)
        if: ${{ !cancelled() }}
        shell: powershell
        env:
          QBIX_POOL_TRACE: '1'
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\windows\smoke.ps1 -Php (Get-Command php).Source -LogDir "$pwd\smoke-logs"
          exit $LASTEXITCODE

      - name: HTTPS (self-signed, Windows certificate store)
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\windows\https-smoke.ps1 -Php (Get-Command php).Source -LogDir "$pwd\smoke-logs"
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-${{ matrix.os }}-php${{ matrix.php }}-x64
          path: smoke-logs
          retention-days: 14

  # The binaries a Windows user actually runs, not the source tree: the
  # committed sbin\qbixserver.phar (what a Composer install starts) under
  # setup-php, and the static qbixserver-windows-x64.exe of the latest
  # release on its own, without any PHP installed. Same smoke test: start,
  # pages from portable workers, a killed worker replaced, --stop, port free.
  binaries:
    name: ${{ matrix.os }} binaries (phar on PHP ${{ matrix.php }}, static exe)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        php: ['8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: sockets, mbstring, openssl, curl, fileinfo, sqlite3, pdo_sqlite
          ini-values: memory_limit=512M
          coverage: none

      - name: Smoke test (sbin\qbixserver.phar)
        shell: powershell
        env:
          QBIX_POOL_TRACE: '1'
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\windows\smoke.ps1 -Php (Get-Command php).Source -Entry sbin\qbixserver.phar -LogDir "$pwd\smoke-logs\phar"
          exit $LASTEXITCODE

      - name: Download the latest release's static Windows binary
        if: ${{ !cancelled() }}
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path C:\vcbin | Out-Null
          gh release download --repo $env:GITHUB_REPOSITORY --pattern qbixserver-windows-x64.exe --dir C:\vcbin --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName
          Get-Item C:\vcbin\qbixserver-windows-x64.exe | Select-Object Name, Length
          & C:\vcbin\qbixserver-windows-x64.exe --version

      # A static binary is phpmicro's runtime with the phar appended (spc micro:combine). Building the runtime takes
      # the release workflow an hour, so this takes the release's and appends this commit's phar: the code of the
      # push, in the runtime users download.
      - name: The release's static runtime with this commit's phar
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          $bytes = [IO.File]::ReadAllBytes('C:\vcbin\qbixserver-windows-x64.exe')
          $text = [Text.Encoding]::GetEncoding(28591).GetString($bytes)
          # the release builds on a Windows checkout, so its stub may have CRLF line ends
          $m = [regex]::Match($text, "(#!/usr/bin/env php\r?\n)?<\?php\r?\nPhar::mapPhar\('qbixserver\.phar'\);")
          $at = if ($m.Success) { $m.Index } else { -1 }
          if ($at -le 0) { Write-Host "::error::no phar stub in the release binary"; exit 1 }
          $phar = [IO.File]::ReadAllBytes("$pwd\sbin\qbixserver.phar")
          $out = New-Object byte[] ($at + $phar.Length)
          [Array]::Copy($bytes, 0, $out, 0, $at)
          [Array]::Copy($phar, 0, $out, $at, $phar.Length)
          [IO.File]::WriteAllBytes('C:\vcbin\qbixserver-windows-x64-current.exe', $out)
          "runtime $at bytes + phar $($phar.Length) bytes"
          & C:\vcbin\qbixserver-windows-x64-current.exe --version
          exit $LASTEXITCODE

      - name: Smoke test (static binary with this commit's phar, on its own)
        if: ${{ !cancelled() }}
        shell: powershell
        env:
          QBIX_POOL_TRACE: '1'
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\windows\smoke.ps1 -Entry C:\vcbin\qbixserver-windows-x64-current.exe -LogDir "$pwd\smoke-logs\exe-current"
          exit $LASTEXITCODE

      # The release as shipped, for the record: a fix reaches it with the next release.
      - name: Smoke test (the latest release's qbixserver-windows-x64.exe as shipped, report only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: powershell
        env:
          QBIX_POOL_TRACE: '1'
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\windows\smoke.ps1 -Entry C:\vcbin\qbixserver-windows-x64.exe -LogDir "$pwd\smoke-logs\exe-release"
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-${{ matrix.os }}-binaries
          path: smoke-logs
          retention-days: 14

  x86:
    name: ${{ matrix.os }} PHP ${{ matrix.php }} x86 (32-bit)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
        php: ['8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Install the official 32-bit PHP (windows.php.net)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\windows\install-php.ps1 -Version ${{ matrix.php }} -Arch x86 -Dest C:\php32
          exit $LASTEXITCODE

      - name: Windows unit gate
        shell: powershell
        run: |
          $env:QBIX_TEST_TMP = $env:RUNNER_TEMP
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\windows\unit-survey.ps1 -Php C:\php32\php.exe -Gate -LogDir "$pwd\smoke-logs"
          exit $LASTEXITCODE

      - name: Smoke test (real server, portable workers)
        if: ${{ !cancelled() }}
        shell: powershell
        env:
          QBIX_POOL_TRACE: '1'
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\windows\smoke.ps1 -Php C:\php32\php.exe -LogDir "$pwd\smoke-logs"
          exit $LASTEXITCODE

      - name: HTTPS (self-signed, Windows certificate store)
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\windows\https-smoke.ps1 -Php C:\php32\php.exe -LogDir "$pwd\smoke-logs"
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-${{ matrix.os }}-php${{ matrix.php }}-x86
          path: smoke-logs
          retention-days: 14

  arm64:
    name: windows-11-arm PHP ${{ matrix.php }} (ARM64 machine)
    runs-on: windows-11-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Install PHP (native ARM64 if windows.php.net has it, else x64 under emulation)
        shell: powershell
        run: |
          (Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber, OSArchitecture | Format-List | Out-String).Trim()
          "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\windows\install-php.ps1 -Version ${{ matrix.php }} -Arch arm64 -Dest C:\php-arm
          exit $LASTEXITCODE

      - name: Windows unit gate
        shell: powershell
        run: |
          $env:QBIX_TEST_TMP = $env:RUNNER_TEMP
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\windows\unit-survey.ps1 -Php C:\php-arm\php.exe -Gate -LogDir "$pwd\smoke-logs"
          exit $LASTEXITCODE

      - name: Smoke test (real server, portable workers)
        if: ${{ !cancelled() }}
        shell: powershell
        env:
          QBIX_POOL_TRACE: '1'
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\windows\smoke.ps1 -Php C:\php-arm\php.exe -LogDir "$pwd\smoke-logs"
          exit $LASTEXITCODE

      - name: HTTPS (self-signed, Windows certificate store)
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\windows\https-smoke.ps1 -Php C:\php-arm\php.exe -LogDir "$pwd\smoke-logs"
          exit $LASTEXITCODE

      - name: Exponential fixture (SQLite)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\windows\exponential-fixture.ps1 -Php C:\php-arm\php.exe -Dir C:\exp -Port 18431 -LogDir "$pwd\smoke-logs"
          exit $LASTEXITCODE

      - name: Exponential site under Velocity, with load
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\windows\exponential-site.ps1 -Php C:\php-arm\php.exe -Dir C:\exp -Port 18431 -LogDir "$pwd\smoke-logs"
          exit $LASTEXITCODE

      - name: Windows service (vcc.ps1, virtual account), with the Exponential site
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\windows\service.ps1 -Php C:\php-arm\php.exe -ExpDir C:\exp -ExpPort 18431 -LogDir "$pwd\smoke-logs"
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-11-arm-php${{ matrix.php }}
          path: smoke-logs
          retention-days: 14

  exponential:
    name: ${{ matrix.os }} PHP ${{ matrix.php }} Exponential site + service
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            php: '8.3'
          - os: windows-2025
            php: '8.5'
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: sockets, mbstring, openssl, curl, fileinfo, sqlite3, pdo_sqlite, intl, xsl, gd, zip, exif
          ini-values: memory_limit=512M
          tools: composer
          coverage: none

      - name: Exponential fixture (SQLite)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\windows\exponential-fixture.ps1 -Php (Get-Command php).Source -Dir C:\exp -Port 18431 -LogDir "$pwd\smoke-logs"
          exit $LASTEXITCODE

      - name: Exponential site under Velocity, with load
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\windows\exponential-site.ps1 -Php (Get-Command php).Source -Dir C:\exp -Port 18431 -LogDir "$pwd\smoke-logs"
          exit $LASTEXITCODE

      - name: Windows service (vcc.ps1, virtual account), with the Exponential site
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\windows\service.ps1 -Php (Get-Command php).Source -ExpDir C:\exp -ExpPort 18431 -LogDir "$pwd\smoke-logs"
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-${{ matrix.os }}-php${{ matrix.php }}-exponential
          path: smoke-logs
          retention-days: 14

  unit-survey:
    name: unit tests survey (windows-2025, PHP 8.3)
    runs-on: windows-2025
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.3'
          extensions: sockets, mbstring, openssl, curl, fileinfo, sqlite3, pdo_sqlite, intl, zip
          ini-values: memory_limit=512M
          coverage: none
      - name: Every unit test on Windows
        shell: powershell
        run: |
          $env:QBIX_TEST_TMP = $env:RUNNER_TEMP
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\windows\unit-survey.ps1 -Php (Get-Command php).Source -Timeout 90 -LogDir "$pwd\survey-logs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-unit-survey
          path: survey-logs
          retention-days: 14
