name: tests

on:
  push:
  pull_request:

jobs:
  # The phar is rebuilt first and the suites below test the rebuilt one, so a
  # push that changes the sources is tested with the phar that ends up on main
  # (tests/phar-is-current.php is part of the main suite). On a push to main a
  # drifted phar is also committed back; that commit is made with the workflow
  # token, which starts no further runs, and its tree is exactly the one tested
  # here. Other branches and pull requests only test the rebuilt phar.
  phar:
    name: rebuild sbin/qbixserver.phar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          ini-values: phar.readonly=0
          coverage: none

      - name: Rebuild if the contents drifted
        run: |
          # Bytes are no guide here: two builds of identical sources differ in
          # the phar's own metadata, so committing on every push would churn
          # the repository. tests/phar-is-current.php compares what is inside.
          if php tests/phar-is-current.php; then
            echo "nothing to do"
            exit 0
          fi
          php -d phar.readonly=0 build-phar.php
          php tests/phar-is-current.php
          echo "REBUILT=1" >> "$GITHUB_ENV"

      - name: Commit to main
        if: env.REBUILT == '1' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sbin/qbixserver.phar bin/qbixserver.phar
          git commit -m "Rebuild sbin/qbixserver.phar from ${GITHUB_SHA::7}"
          git push || { git pull --rebase && git push; }

      - uses: actions/upload-artifact@v4
        with:
          name: qbixserver-phar
          # The phar and its copy at the former path (docs/layout.md,
          # "Programs"), restored to the checkout's root by the jobs below.
          path: |
            sbin/qbixserver.phar
            bin/qbixserver.phar
          retention-days: 3

  standalone:
    needs: phar
    name: standalone mode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use the phar rebuilt for this run
        uses: actions/download-artifact@v4
        with:
          name: qbixserver-phar
          path: .

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pcntl, posix, gd, zip, mbstring, sockets
          coverage: none

      - name: Syntax check every source file
        run: |
          set -e
          find src sbin bin qbixserver.php qbixctl.php qbixconsole.php qshell.php -name '*.php' -print0 \
            | xargs -0 -n1 php -l > /dev/null
          echo "all files parse"

      - name: Main suite
        run: bash tests/run.sh --quick

      - name: SAPI suite
        run: php tests/testSapi.php

      - name: Idle worker survival
        run: bash tests/idle-worker.sh

      - name: Content-Type on PHP responses
        run: bash tests/content-type.sh

      - name: phpinfo renderer
        run: php tests/phpinfo.php

      - name: Document root listing
        run: bash tests/root-listing.sh

      - name: Cookies and sessions
        run: bash tests/cookies-sessions.sh

      - name: Autoloaders across requests
        run: bash tests/autoloader-persistence.sh

      - name: REQUEST_* keys across requests
        run: bash tests/request-keys-reset.sh

      - name: Working directory per request
        run: bash tests/working-directory.sh

      - name: SCRIPT_NAME below the root
        run: bash tests/script-name.sh

      - name: Shimmed calls inside namespaces
        run: bash tests/namespaced-scripts.sh

      - name: Lazily initialised statics
        run: bash tests/lazy-statics.sh

      - name: Binary response bodies
        run: bash tests/binary-response.sh

      - name: End-to-end probe (standalone only)
        run: bash tests/run-probe.sh
        continue-on-error: true

  cgi:
    needs: phar
    name: php-cgi carveout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use the phar rebuilt for this run
        uses: actions/download-artifact@v4
        with:
          name: qbixserver-phar
          path: .

      - name: Set up PHP (with CGI binary)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pcntl, posix, mbstring, sockets
          coverage: none

      - name: Install php-cgi
        run: sudo apt-get update -qq && sudo apt-get install -y -qq php8.3-cgi

      - name: CGI carveout suite
        run: bash tests/run-cgi.sh

  platform:
    needs: phar
    name: --app mode (against real Platform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use the phar rebuilt for this run
        uses: actions/download-artifact@v4
        with:
          name: qbixserver-phar
          path: .

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pcntl, posix, gd, zip, mbstring, sockets
          coverage: none

      - name: Check out the Qbix Platform
        uses: actions/checkout@v4
        with:
          repository: Qbix/Platform
          path: .platform
          submodules: recursive

      - name: Platform compatibility audit
        run: |
          set -e
          out=$(php tests/platform-compat.php "$GITHUB_WORKSPACE/.platform/platform")
          echo "$out"
          echo "$out" | grep -q '^PASS:' \
            || { echo "::warning::Platform compat audit did not PASS"; exit 0; }
        continue-on-error: true

      - name: Routing parity
        run: |
          set -e
          bash tests/fixtures/make-app.sh \
            "$GITHUB_WORKSPACE/.platform/platform" /tmp/TestApp 20099 >/dev/null
          out=$(QBIX_APP_DIR=/tmp/TestApp \
            php tests/routing-parity.php "$GITHUB_WORKSPACE/.platform/platform")
          echo "$out"
          echo "$out" | grep -q ' 0 failed' \
            || { echo "::warning::Routing parity had failures"; exit 0; }
        continue-on-error: true

      - name: Dual-mode end-to-end probe
        run: bash tests/run-probe.sh "$GITHUB_WORKSPACE/.platform/platform"
        continue-on-error: true

      - name: Dual-mode acceptance suite
        run: bash tests/run-modes.sh /tmp/TestApp "$GITHUB_WORKSPACE/.platform/platform"
        continue-on-error: true
