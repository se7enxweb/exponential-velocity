name: Docker images

# The server on the official PHP image, one image per PHP version x variant,
# for amd64 and arm64: ghcr.io/se7enxweb/exponential-velocity. docs/docker.md has
# the tags and what each variant carries; packaging/docker/ builds them.
#
# Every run builds and tests (the server answers /Q/health, and the engine's
# own `ext:check` finds the variant complete). A tag publishes the release's
# fixed tags (never moved: a run stops before it would overwrite one); a push
# to main publishes the moving edge tags (edge, main, edge-php<ver>-<variant>); a
# manual run publishes only when asked to.

on:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'packaging/docker/**'
      - 'packaging/bin/**'
      - 'packaging/sbin/**'
      - 'build/extensions.json'
      - 'sbin/qbixserver.phar'
      - 'bin/qbixserver.phar'
      - '.github/workflows/docker.yml'
  pull_request:
    paths:
      - 'packaging/docker/**'
      - 'build/extensions.json'
      - '.github/workflows/docker.yml'
  workflow_dispatch:
    inputs:
      php:
        description: 'PHP versions, comma-separated (empty = all in the manifest)'
        default: ''
      variants:
        description: 'Variants, comma-separated (empty = mini,lite,standard,full)'
        default: ''
      push:
        description: 'Push the images to GHCR (true/false)'
        default: 'false'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

# A newer push to the same branch supersedes a run still queued or running:
# every push that touches the phar starts this matrix, and the runners are
# shared, so older runs would otherwise hold the queue for commits already
# replaced. Tags and pull requests each have their own ref, so a release run
# is never cancelled by a branch push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.plan.outputs.builds }}
      images: ${{ steps.plan.outputs.images }}
      newest: ${{ steps.plan.outputs.newest }}
      push: ${{ steps.plan.outputs.push }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Plan
        id: plan
        run: |
          php packaging/docker/matrix.php '${{ github.event.inputs.php }}' '${{ github.event.inputs.variants }}' >> "$GITHUB_OUTPUT"
          push=false
          if [ "${GITHUB_REF_TYPE}" = tag ] || [ '${{ github.event.inputs.push }}' = true ]; then push=true; fi
          if [ "${GITHUB_EVENT_NAME}" = push ] && [ "${GITHUB_REF_NAME}" = main ]; then push=true; fi
          echo "push=$push" >> "$GITHUB_OUTPUT"
          # A release tag gives its version; anything else is edge
          version=edge
          if [ "${GITHUB_REF_TYPE}" = tag ]; then version="${GITHUB_REF_NAME#v}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: php${{ matrix.php }} ${{ matrix.variant }} ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    env:
      TAG: php${{ matrix.php }}-${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            VARIANT=${{ matrix.variant }}
          load: true
          tags: qbix-test:${{ env.TAG }}
          cache-from: type=gha,scope=${{ env.TAG }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ env.TAG }}-${{ matrix.arch }}

      - name: Serves a page, is healthy, carries its baseline
        run: |
          set -e
          docker run --rm qbix-test:$TAG cat /usr/share/exponential-velocity/image-extensions.txt
          docker run --rm qbix-test:$TAG qbixctl ext:check --variant='${{ matrix.variant }}'
          # The shell under the packages' name, vc-qshell, and nothing named qshell.
          docker run --rm qbix-test:$TAG sh -ec 'vc-qshell --version | head -1 | grep -q "^vc-qshell (" && ! command -v qshell'
          cid=$(docker run -d -p 18080:8080 qbix-test:$TAG)
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/Q/health || true)
            [ "$code" = 200 ] && break; sleep 1
          done
          docker logs "$cid" | tail -20
          [ "$code" = 200 ] || { echo "::error::/Q/health answered $code"; exit 1; }
          docker exec "$cid" php /usr/share/exponential-velocity/packaging/docker/healthcheck.php
          # Not root, and the Debian-style trees in place (docs/docker.md)
          docker exec "$cid" sh -ec '[ "$(id -u)" != 0 ] && [ "$(id -un)" = www-data ]'
          if docker logs "$cid" 2>&1 | grep -E 'panel: LOCKED|Permission denied'; then echo "::error::the server cannot write what it needs as www-data"; exit 1; fi
          docker exec "$cid" sh -ec 'for d in /etc/qbix /etc/vc; do for k in sites conf mods; do test -d "$d/$k-available" && test -d "$d/$k-enabled" && test -w "$d/$k-available"; done; done; test -f /etc/qbix/qbix.conf && test -f /etc/qbix/ports.conf && test -L /etc/qbix/sites-enabled/default.conf'
          docker rm -f "$cid" >/dev/null
          docker image ls qbix-test:$TAG

      - name: Log in to GHCR
        if: needs.plan.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push this architecture
        if: needs.plan.outputs.push == 'true'
        run: |
          ref="$IMAGE:${{ needs.plan.outputs.version }}-$TAG-${{ matrix.arch }}"
          # A release's tags are fixed: never overwrite one that exists
          if [ '${{ needs.plan.outputs.version }}' != edge ] && docker manifest inspect "$ref" >/dev/null 2>&1; then
            echo "::error::$ref exists already; a published version tag is never moved"; exit 1
          fi
          docker tag qbix-test:$TAG "$ref"
          docker push "$ref"

  # One multi-architecture tag per image from the per-architecture pushes:
  # <version>-php<ver>-<variant>, php<ver>-<variant>, and latest for the
  # newest PHP's standard image; from main, edge-php<ver>-<variant>, edge and main.
  publish:
    needs: [plan, build]
    if: needs.plan.outputs.push == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.images) }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag
        run: |
          v='${{ needs.plan.outputs.version }}'
          t='php${{ matrix.php }}-${{ matrix.variant }}'
          newest=false
          if [ '${{ matrix.php }}' = '${{ needs.plan.outputs.newest }}' ] && [ '${{ matrix.variant }}' = standard ]; then newest=true; fi
          if [ "$v" = edge ]; then
            tags="-t $IMAGE:edge-$t"
            [ "$newest" = true ] && tags="$tags -t $IMAGE:edge -t $IMAGE:main"
          else
            if docker buildx imagetools inspect "$IMAGE:$v-$t" >/dev/null 2>&1; then
              echo "::error::$IMAGE:$v-$t exists already; a published version tag is never moved"; exit 1
            fi
            tags="-t $IMAGE:$v-$t -t $IMAGE:$t"
            [ "$newest" = true ] && tags="$tags -t $IMAGE:latest -t $IMAGE:$v"
          fi
          docker buildx imagetools create $tags "$IMAGE:$v-$t-amd64" "$IMAGE:$v-$t-arm64"
          docker buildx imagetools inspect "$IMAGE:$v-$t"
